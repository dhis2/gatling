name: Unofficial glog CLI Release

on:
  push:
    branches:
      - glog-cli
  workflow_dispatch:

concurrency:
  group: glog-cli-release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    # Only run on your fork, not the official repository
    if: github.repository != 'gatling/gatling'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAVA_OPTS: "-Xmx4G"
      SBT_OPTS: "-Dsbt.ci=true -Xss100M"
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache SBT dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt/launchers
            ~/.sbt/boot
            ~/.sbt/preloaded
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/plugins.sbt', '**/build.properties') }}

      - name: Build glog CLI
        run: |
          echo "Building Gatling Log Parser CLI (glog)..."
          ./build-glog.sh

      - name: Prepare release artifacts
        run: |
          # Create release directory
          mkdir -p release
          
          # Copy distribution zip
          cp gatling-log-parser-cli/target/universal/glog.zip release/glog-0.0.1.zip
          
          # Copy the project README
          cp README-CLI.md release/README.md
          
          # Show what we built
          echo "Release artifacts:"
          ls -la release/
          echo ""
          echo "Distribution size:"
          du -h release/glog-0.0.1.zip

      - name: Test the distribution
        run: |
          echo "Testing the built distribution..."
          cd release
          unzip -q glog-0.0.1.zip
          ./glog/bin/glog --help

      - name: Delete existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release and tag if they exist
          gh release delete v0.0.1 --yes 2>/dev/null || echo "No existing release to delete"
          git tag -d v0.0.1 2>/dev/null || echo "No existing tag to delete"
          git push origin :v0.0.1 2>/dev/null || echo "No existing remote tag to delete"

      - name: Create new release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create new tag
          git tag v0.0.1
          git push origin v0.0.1
          
          # Create release with artifacts
          gh release create v0.0.1 \
            --title "Unofficial Gatling Log Parser CLI v0.0.1" \
            --notes "**⚠️ UNOFFICIAL BUILD - NOT SUPPORTED BY GATLING TEAM**

          This is an automatically generated release of the unofficial Gatling Log Parser CLI.
          
          ## What's Included
          
          * \`glog-0.0.1.zip\` - Complete distribution with JVM executable and dependencies
          * \`README.md\` - Installation and usage instructions
          
          ## Quick Start
          
          1. Download \`glog-0.0.1.zip\`
          2. Extract: \`unzip glog-0.0.1.zip\`
          3. Use: \`./glog/bin/glog --config gatling.conf simulation.log\`
          
          ## About This Build
          
          * Built from branch: \`glog-cli\`
          * Commit: ${{ github.sha }}
          * Version: 0.0.1 (WIP)
          * Target: Cross-platform JVM
          * Requires: Java 17+
          * This is NOT an official Gatling release
          
          For support, please contact the fork maintainer." \
            --latest \
            release/glog-0.0.1.zip \
            release/README.md

      - name: Summary
        run: |
          echo "🎉 Unofficial Gatling Log Parser CLI build completed!"
          echo ""
          echo "📦 Release: https://github.com/${{ github.repository }}/releases/tag/v0.0.1"
          echo "📋 Artifacts:"
          echo "  - glog-0.0.1.zip (JVM distribution for all platforms)"
          echo "  - README.md (Installation and usage instructions)"
          echo ""
          echo "⚠️  This is an UNOFFICIAL build, not supported by the Gatling team"
          echo "🔧 Built from branch: glog-cli"
          echo "📝 Commit: ${{ github.sha }}"